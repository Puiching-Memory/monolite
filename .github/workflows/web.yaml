name: web

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # The site does not use the social-card plugin. Its unused imaging extra
      # pins vulnerable Pillow 10.x and cannot build on newer Python versions.
      - run: pip install mkdocs-material==9.6.7 mkdocs-git-revision-date-localized-plugin==1.4.4 mkdocs-git-authors-plugin==0.9.2 mkdocs-static-i18n==1.3.0
      - run: mkdocs build

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - run: pip install mkdocs-material==9.6.7 mkdocs-git-revision-date-localized-plugin==1.4.4 mkdocs-git-authors-plugin==0.9.2 mkdocs-static-i18n==1.3.0
      - run: mkdocs gh-deploy --force
